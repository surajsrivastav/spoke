services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: spoke
      POSTGRES_PASSWORD: spoke_dev
      POSTGRES_DB: spoke_dev
    ports:
      - "127.0.0.1:${SPOKE_DB_PORT:-5432}:5432"
    volumes:
      - spoke_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spoke -d spoke_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  temporal:
    image: temporalio/auto-setup:1.25.0
    ports:
      - "127.0.0.1:${SPOKE_TEMPORAL_PORT:-7233}:7233"
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: spoke
      POSTGRES_PWD: spoke_dev
      POSTGRES_SEEDS: postgres
      TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "temporal", "operator", "namespace", "list"]
      interval: 10s
      timeout: 5s
      retries: 5

  temporal-web:
    image: temporalio/web:1.15.0
    ports:
      - "127.0.0.1:${SPOKE_TEMPORAL_UI_PORT:-8233}:8088"
    environment:
      TEMPORAL_GRPC_ENDPOINT: temporal:7233
    depends_on:
      temporal:
        condition: service_healthy

  whatsapp-edge:
    profiles: ["experimental-whatsapp"]
    build:
      context: .
      dockerfile: apps/whatsapp-edge/Dockerfile
    ports:
      - "127.0.0.1:${SPOKE_WHATSAPP_PORT:-3002}:3002"
    env_file: ${SPOKE_ENV_FILE:-.env.local}
    depends_on:
      postgres:
        condition: service_healthy

  slack-edge:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: apps/slack-edge/Dockerfile
    ports:
      - "127.0.0.1:${SPOKE_SLACK_PORT:-3001}:3001"
    env_file: ${SPOKE_ENV_FILE:-.env.local}
    environment:
      DATABASE_URL: postgresql://spoke:spoke_dev@postgres:5432/spoke_dev
    depends_on:
      postgres:
        condition: service_healthy

  orchestrator:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: apps/orchestrator/Dockerfile
    env_file: ${SPOKE_ENV_FILE:-.env.local}
    environment:
      DATABASE_URL: postgresql://spoke:spoke_dev@postgres:5432/spoke_dev
      TEMPORAL_ADDRESS: temporal:7233
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy

  operator-ui:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: apps/operator-ui/Dockerfile
    ports:
      - "127.0.0.1:${SPOKE_UI_PORT:-3000}:3000"
    env_file: ${SPOKE_ENV_FILE:-.env.local}
    environment:
      DATABASE_URL: postgresql://spoke:spoke_dev@postgres:5432/spoke_dev
      TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  spoke_pg_data:
