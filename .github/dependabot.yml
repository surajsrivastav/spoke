version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories:
      - /
      - /apps/operator-ui
      - /apps/orchestrator
      - /apps/slack-edge
      - /apps/whatsapp-edge
    schedule:
      interval: weekly
